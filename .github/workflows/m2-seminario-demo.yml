name: M2 seminario - demonstracao operacional isolada
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m2-seminario-demo.yml'
      - 'demo_m2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demonstracao:
    name: Kafka e NATS - operacoes reais
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: Demonstrar Kafka, follower, falha, recuperacao e JetStream
        shell: bash
        run: bash demo_m2/ci.sh
      - name: Arquivar logs e estados mesmo em falhas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-seminario-demo-${{ github.run_id }}
          path: artifacts/seminario-demo/
          retention-days: 30
          if-no-files-found: warn
